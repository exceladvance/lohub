<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LO Academy | Mortgage Loan Officer Training</title>
<meta name="description" content="LO Academy is a front-end demo learning and professional-development platform for mortgage loan officers. All data is sample data stored only in your browser.">
<style>
:root{
  --navy:#0f172a;--navy-2:#0b1222;--navy-3:#1e293b;--gold:#d9a51f;--gold-d:#b8880f;
  --bg:#f8fafc;--card:#ffffff;--fg:#0f172a;--muted:#64748b;--border:#e2e8f0;--soft:#f1f5f9;
  --chart1:#0f172a;--chart2:#d9a51f;--ok:#15803d;--okbg:#dcfce7;--warn:#a16207;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05);--ring:#d9a51f;
}
:root[data-theme=dark]{
  --bg:#0a1020;--card:#111a2e;--fg:#e8edf6;--muted:#94a3b8;--border:#223049;--soft:#17223a;
  --chart1:#94a3b8;--ok:#4ade80;--okbg:#10301d;--warn:#facc15;--warnbg:#3a2f0a;--bad:#f87171;--badbg:#3b1414;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.sidebar{position:fixed;inset:0 auto 0 0;width:256px;background:var(--navy);color:#cbd5e1;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--gold);color:var(--navy);font-weight:800;display:grid;place-items:center}
.brand b{font-size:19px;color:#fff;letter-spacing:.2px;flex:1}
.icon-btn{background:transparent;border:0;color:#cbd5e1;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--navy-3);color:#fff}
nav.main{padding:6px 12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
nav.main a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#aab6c8;font-weight:500}
nav.main a:hover{background:var(--navy-3);color:#fff}
nav.main a[aria-current=page]{background:var(--gold);color:var(--navy);font-weight:600}
.profile{border-top:1px solid #1e293b;padding:16px 18px;display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.sm{width:30px;height:30px;font-size:11px;background:var(--soft);color:var(--fg);border:1px solid var(--border)}
.avatar.md{width:40px;height:40px;font-size:13px;background:var(--navy);color:var(--gold)}
.profile .who{flex:1;min-width:0}.profile .who b{color:#fff;display:block;font-size:14px}.profile .who span{font-size:12px;color:#94a3b8}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;background:#ef4444;border-radius:50%}
.topbar{display:none;position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px 14px;align-items:center;gap:10px}
.scrim{display:none;position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:35}
main{margin-left:256px;padding:32px;min-height:100vh}
.page{max-width:1180px;margin:0 auto;animation:pin .2s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:1023px){
  .sidebar{transform:translateX(-100%)}
  body.menu-open .sidebar{transform:none}
  body.menu-open .scrim{display:block}
  .topbar{display:flex}
  main{margin-left:0;padding:20px 16px}
}

/* type + cards */
.ph{margin-bottom:24px}
.ph h1{font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.ph p{color:var(--muted);margin-top:6px;max-width:760px}
@media(max-width:600px){.ph h1{font-size:28px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px}
.card.hover{transition:transform .15s,box-shadow .15s}
.card.hover:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,23,42,.1)}
.card h2{font-size:18px;font-weight:700;margin-bottom:14px}
.card h3{font-size:15.5px;font-weight:650}
.muted{color:var(--muted)}.small{font-size:12.5px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stat{display:flex;justify-content:space-between;align-items:flex-start}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:500}.stat .val{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.stat .ico{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--navy-3)}
.stat .ico.gold{background:#fbf1d3;color:var(--gold-d)}
:root[data-theme=dark] .stat .ico{color:var(--fg)}
:root[data-theme=dark] .stat .ico.gold{background:#3a2f0a;color:var(--gold)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--fg);border:1px solid var(--border)}
.badge.gold{background:#fbf1d3;color:#7a5a05;border-color:#f0d68a}
.badge.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.badge.draft{background:var(--soft);color:var(--muted)}
:root[data-theme=dark] .badge.gold{background:#3a2f0a;color:var(--gold);border-color:#5a4710}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:9px 15px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--fg);transition:background .15s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-3)}
:root[data-theme=dark] .btn.primary{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}.btn.gold:hover{background:var(--gold-d)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.saved{background:var(--okbg);color:var(--ok);border-color:transparent}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:13px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 12px}
textarea{min-height:90px;resize:vertical}
.err{color:var(--bad);font-size:12.5px;min-height:1em}
.note{background:var(--soft);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.note .ic{width:15px;height:15px;margin-top:2px}
.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:999px}
.bar.navy>i{background:var(--chart1)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:thin}
.tab{border:1px solid var(--border);background:var(--card);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted)}
.tab:hover{background:var(--soft)}
.tab[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme=dark] .tab[aria-selected=true]{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border)}
tr.me td{background:#fbf1d3;color:#3b2d02}
:root[data-theme=dark] tr.me td{background:#2e260a;color:#f6e7b3}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.num{text-align:right}
.rk{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft)}
.rk.r1{background:#f6d365;color:#4a3500}.rk.r2{background:#d7dde5;color:#334155}.rk.r3{background:#e0a878;color:#4a2a0a}
details.acc{border:1px solid var(--border);border-radius:10px;background:var(--card);margin-bottom:10px}
details.acc summary{padding:14px 16px;font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:20px;color:var(--muted)}
details.acc[open] summary::after{content:"\2212"}
details.acc .body{padding:0 16px 16px}
.script{white-space:pre-wrap;background:var(--soft);border-radius:9px;padding:14px;border-left:3px solid var(--gold);margin-bottom:12px}

/* thumbnails and covers */
.thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;padding:12px;color:#fff;background:linear-gradient(135deg,#0f172a,#1e3a5f)}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center}
.thumb .pl span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(2px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35)}
.thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(2,6,23,.75);padding:1px 7px;border-radius:5px;font-size:12px;font-weight:600}
.thumb .pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}.thumb .pg i{display:block;height:100%;background:var(--gold)}
.t-Prospecting{background:linear-gradient(135deg,#0f172a,#1d4e89)}.t-Underwriting{background:linear-gradient(135deg,#1f2937,#4b5563)}
.t-Rate{background:linear-gradient(135deg,#0f172a,#0f766e)}.t-Agent{background:linear-gradient(135deg,#1e1b4b,#6d28d9)}
.t-Closing{background:linear-gradient(135deg,#3b2a05,#b8880f)}.t-Compliance{background:linear-gradient(135deg,#0f172a,#7f1d1d)}
.cover{width:150px;aspect-ratio:2/3;border-radius:6px 12px 12px 6px;background:linear-gradient(160deg,#0f172a,#1e293b);color:var(--gold);padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:6px 8px 18px rgba(15,23,42,.3);border-left:6px solid var(--gold);flex:none}
.cover b{font-size:16px;line-height:1.15;letter-spacing:.3px;text-transform:uppercase}.cover span{font-size:11px;color:#cbd5e1;letter-spacing:1px;text-transform:uppercase}
.cover.c2{background:linear-gradient(160deg,#3b2a05,#7a5a05)}.cover.c3{background:linear-gradient(160deg,#102a43,#1d4e89)}.cover.c4{background:linear-gradient(160deg,#1e1b4b,#4c1d95)}
.cover.sm{width:100%;max-width:110px}.cover.sm b{font-size:12px}

/* misc blocks */
.post{display:flex;gap:14px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:38px}
.votes button{border:0;background:transparent;color:var(--muted);width:30px;height:28px;border-radius:7px;display:grid;place-items:center}
.votes button:hover{background:var(--soft)}
.votes button[aria-pressed=true]{color:var(--gold-d);background:#fbf1d3}
:root[data-theme=dark] .votes button[aria-pressed=true]{background:#3a2f0a;color:var(--gold)}
.votes b{font-size:14px}
.reply{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.check input{width:18px;height:18px;accent-color:#b8880f}
.check input:checked+span{text-decoration:line-through;color:var(--muted)}
.badge-tile{text-align:center;padding:16px 10px}
.badge-tile .bi{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:#fbf1d3;color:var(--gold-d);border:2px solid var(--gold)}
.badge-tile .bi .ic{width:24px;height:24px}
.badge-tile.locked{opacity:.65}.badge-tile.locked .bi{background:var(--soft);color:var(--muted);border:2px dashed var(--border)}
:root[data-theme=dark] .badge-tile .bi{background:#3a2f0a;color:var(--gold)}
.ratestrip{background:var(--navy);color:#cbd5e1;border-radius:12px;padding:18px 22px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-bottom:22px}
.ratestrip .r b{display:block;font-size:26px;color:var(--gold);letter-spacing:-.5px}
.ratestrip .r span{font-size:12.5px}
.ratestrip .tag{margin-left:auto;font-size:12px;border:1px solid #334155;padding:4px 10px;border-radius:999px;color:#e2e8f0}
.hero{background:linear-gradient(135deg,var(--navy),#16233f);color:#fff;border-radius:14px;padding:26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero .avatar{width:84px;height:84px;font-size:28px}
.hero h2{color:#fff;margin:0 0 4px;font-size:26px}
.hero .badge{background:#1e293b;color:#e2e8f0;border-color:#334155}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 0}
.cal button{aspect-ratio:1;border:1px solid transparent;border-radius:9px;background:transparent;font-weight:500;min-height:36px}
.cal button.av{background:var(--soft);border-color:var(--border);font-weight:700}
.cal button.av:hover{border-color:var(--gold)}
.cal button.sel{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.cal button[disabled]{color:var(--muted);opacity:.4;cursor:default}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:9px;font-weight:600}
.slot:hover{border-color:var(--gold);background:#fbf1d3;color:#3b2d02}
.res{display:flex;gap:14px}
.res .ri{width:42px;height:42px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--gold-d)}

/* dialog */
dialog{border:1px solid var(--border);border-radius:14px;padding:0;background:var(--card);color:var(--fg);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(2,6,23,.4)}
dialog::backdrop{background:rgba(2,6,23,.6)}
.dlg{padding:22px;position:relative}
.dlg .x{position:absolute;top:12px;right:12px;border:0;background:var(--soft);width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.dlg h2{padding-right:40px;margin-bottom:12px;font-size:20px}
.player{aspect-ratio:16/9;border-radius:10px;display:grid;place-items:center;color:#fff;text-align:center;padding:16px;margin-bottom:14px}
.player .big{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 10px;border:1px solid rgba(255,255,255,.4)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:100;border:1px solid var(--gold);max-width:calc(100vw - 32px);font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
.tip{position:fixed;z-index:90;background:var(--navy);color:#fff;padding:6px 10px;border-radius:8px;font-size:12.5px;pointer-events:none;display:none;border:1px solid #334155}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
svg.chart .grid{stroke:var(--border)}
svg.chart rect.b{cursor:pointer;transition:opacity .15s}svg.chart rect.b:hover{opacity:.8}
.legend{display:flex;gap:16px;font-size:12.5px;margin-top:8px}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
</style>
</head>
<body>
<a class="sr" href="#content">Skip to content</a>
<div class="topbar">
  <button class="icon-btn" data-act="menu" aria-label="Open navigation menu" data-testid="button-menu"></button>
  <div class="logo" style="width:30px;height:30px;font-size:13px">LO</div><b>Academy</b>
</div>
<div class="scrim" data-act="menu-close"></div>
<aside class="sidebar" id="sidebar" aria-label="Primary">
  <div class="brand">
    <div class="logo" aria-hidden="true">LO</div><b>Academy</b>
    <button class="icon-btn" data-act="theme" aria-label="Toggle light and dark theme" data-testid="button-theme-toggle"></button>
  </div>
  <nav class="main" id="nav" aria-label="Main navigation"></nav>
  <div class="profile">
    <div class="avatar" aria-hidden="true">AR</div>
    <div class="who"><b>Alex Rivera</b><span>Rank #4</span></div>
    <button class="icon-btn" data-act="bell" aria-label="Notifications (demo)" data-testid="button-notifications"></button>
  </div>
</aside>
<main id="content" tabindex="-1"><div id="view"></div></main>
<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I={
"layout-dashboard":'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
"book-open":'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
"play-square":'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 8 6 4-6 4Z"/>',
trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
"message-square":'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barChart(labels,series,o){
  const W=640,H=300,L=52,B=32,T=12,R=10,iw=W-L-R,ih=H-T-B;
  const max=niceMax(Math.max(...series.flatMap(s=>s.data))*1.05||1),ticks=5,n=labels.length,gw=iw/n,sw=Math.min(36,gw*.7/series.length);
  let g="";
  for(let i=0;i<=ticks;i++){const v=max*i/ticks,y=T+ih-ih*i/ticks;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${o.fmt(v)}</text>`}
  labels.forEach((lb,i)=>{const cx=L+gw*i+gw/2;g+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${esc(lb)}</text>`;
    series.forEach((s,j)=>{const v=s.data[i],h=ih*v/max,x=cx-sw*series.length/2+sw*j,y=T+ih-h,tip=`${lb}: ${s.name?s.name+" ":""}${o.fmt(v)}`;
      g+=`<rect class="b" x="${x+1}" y="${y}" width="${sw-2}" height="${Math.max(h,0)}" rx="4" fill="${s.color}" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(tip)}"/>`})});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}</svg>`;
}

  <div class="grid g21" style="margin-top:18px">
   <div class="card"><h2>Schedule a 1:1 Session</h2><div class="grid g2" style="gap:24px">
    <div><div class="row between" style="margin-bottom:10px"><button class="btn sm" data-act="calprev" aria-label="Previous month" data-testid="button-cal-prev">${ic("left")}</button><b>${first.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</b><button class="btn sm" data-act="calnext" aria-label="Next month" data-testid="button-cal-next">${ic("right")}</button></div>
     <div class="cal">${["M","T","W","T","F","S","S"].map(d=>`<span class="dh" aria-hidden="true">${d}</span>`).join("")}${cells}</div><p class="small muted" style="margin-top:8px">Sample availability: Monday to Thursday.</p></div>
    <div><h3 style="margin-bottom:4px">${sd?dstr(sd):"Select a date"}</h3><p class="small muted" style="margin-bottom:12px">Times shown in Eastern Time (ET)</p>
     ${sd?`<div class="slots">${SLOTS.map(t=>taken(selDay,t)?`<button class="slot" disabled style="opacity:.45">${t} (booked)</button>`:`<button class="slot" data-act="slot" data-t="${t}" data-testid="slot-${slug(t)}">${t}</button>`).join("")}</div>`:`<p class="muted">Choose an available date to see time slots.</p>`}</div></div>
    <div style="margin-top:14px">${note("Booking is a browser-only simulation. No real appointment or meeting link is created.")}</div></div>
   <div class="stack"><div class="card"><h2>Next Appointment</h2><div class="badge ${next?"ok":""}" style="margin-bottom:8px">${next?"Your demo booking":"Sample appointment"}</div>
    <p><b>${dstr(nd)}</b></p><p class="muted">${next?next.time:"10:30 AM"} ET | ${next?next.topic:"Pipeline Review"}</p>
    <div class="row wrap" style="margin-top:12px"><button class="btn primary sm" data-act="join" data-testid="button-join-session">Join session</button>${next?`<button class="btn sm" data-act="cancelbook" data-id="${next.id}" data-testid="button-cancel-booking">Cancel demo booking</button>`:""}</div></div>
    ${S.bookings.length>1?`<div class="card"><h3 style="margin-bottom:8px">Other demo bookings</h3>${S.bookings.filter(b=>b!==next).map(b=>`<p class="small">${dstr(new Date(b.key+"T00:00:00"),{month:"short",day:"numeric"})}, ${b.time} ET: ${b.topic}</p>`).join("")}</div>`:""}
    <div class="card"><h2>Past Session Notes</h2>${notes.map((n,i)=>`<div style="padding:10px 0;border-top:${i?"1px solid var(--border)":"0"}"><div class="row between"><b>${n[1]}</b><span class="small muted">${dstr(addDays(today(),-n[0]),{month:"short",day:"numeric",year:"numeric"})}</span></div><p class="small muted">${n[2]}</p></div>`).join("")}<p class="small muted">Sample notes.</p></div></div></div>`;
};
function bookDialog(t){
  const sd=new Date(selDay+"T00:00:00");
  openDlg(`<h2 id="dlg-title">Book Session with Lee</h2><p style="margin-bottom:14px"><b>${dstr(sd)}</b> at <b>${t}</b> ET</p><form data-form="book" data-t="${t}" novalidate>
  <div class="field"><label for="bt">Topic</label><select id="bt" name="topic" data-testid="select-topic">${TOPICS.map(x=>`<option>${x}</option>`).join("")}</select></div>
  <div class="field"><label for="bn">Notes for Lee (optional)</label><textarea id="bn" name="notes" data-testid="input-session-notes"></textarea></div>${note("Demo only. Confirming saves a simulated booking in this browser. No meeting is scheduled and nobody is notified.")}
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn gold" type="submit" data-testid="button-confirm-booking">Confirm demo booking</button></div></form>`);
}
let rq="";
const resItems=()=>{const q=rq.trim().toLowerCase();const items=RESOURCES.map((r,i)=>({r,i})).filter(({r})=>!q||(r[0]+" "+r[1]+" "+r[2]).toLowerCase().includes(q));
  const out=RCATS.map(c=>{const g=items.filter(x=>x.r[1]===c);return g.length?`<h2 style="font-size:18px;margin:20px 0 12px">${c}</h2><div class="grid g2">${g.map(({r,i})=>`<div class="card res hover"><div class="ri">${ic(r[3])}</div><div class="grow"><h3>${r[0]}</h3><p class="small muted">${r[2]}</p></div><button class="btn sm" data-act="resdl" data-i="${i}" aria-label="Download sample text file for ${r[0]}" data-testid="button-download-${i}">${ic("download")} Sample</button></div>`).join("")}</div>`:""}).join("");
  return out||`<div class="card muted" style="margin-top:16px">No resources match your search.</div>`};
P["/resources"]=()=>head("Resources Hub","Reference tools and learning materials. Downloads are simple sample text files, not real PDFs or workbooks.")+
  `<div class="ratestrip"><div class="r"><b>6.875%</b><span>30-Year Fixed</span></div><div class="r"><b>6.125%</b><span>15-Year Fixed</span></div><div class="r"><b>5.750%</b><span>5/1 ARM</span></div><span class="tag">Sample Rates - Demo Only</span></div>
  <p class="small muted" style="margin:-10px 0 16px">Illustrative figures only. Not a live rate feed, offer, or APR quote.</p>
  <div class="field" style="max-width:420px"><label for="rs">Search resources</label><input type="search" id="rs" value="${esc(rq)}" data-input="res" placeholder="Search by name or topic" data-testid="input-resource-search"></div><div id="res-list">${resItems()}</div>`;
P["404"]=()=>head("Page not found","That page does not exist.")+`<div class="card"><p style="margin-bottom:14px">Try one of the sections in the sidebar, or head back to your dashboard.</p><a class="btn primary" href="#/" data-testid="link-home">Go to Dashboard</a></div>`;

/* ---------- router ---------- */
function route(){
  if(dlg.open)dlg.close();
  const h=location.hash.replace(/^#/,"")||"/";const path=h.startsWith("/")?h:"/";
  const key=P[path]&&path!=="404"?path:"404";
  $("#nav").innerHTML=NAV.map(n=>`<a href="#${n[0]}" ${n[0]===key?'aria-current="page"':""} data-testid="link-nav-${slug(n[1])}">${ic(n[2])}<span>${n[1]}</span></a>`).join("");
  const label=(NAV.find(n=>n[0]===key)||["","Not Found"])[1];document.title=label+" | LO Academy";
  render(key);document.body.classList.remove("menu-open");
}
function render(key){
  key=key||(P[location.hash.replace(/^#/,"")]?location.hash.replace(/^#/,""):"/");
  const v=$("#view");
  try{v.innerHTML=`<div class="page">${P[key]()}</div>`}
  catch(e){console.error(e);v.innerHTML=`<div class="page"><div class="card"><h2>Something went wrong</h2><p class="muted" style="margin-bottom:12px">This page failed to render.</p><button class="btn primary" onclick="location.reload()">Reload</button></div></div>`}
}
function rerender(){const y=scrollY;const p=location.hash.replace(/^#/,"")||"/";render(P[p]?p:"404");scrollTo(0,y)}
window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});

/* ---------- theme ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;$('[data-act=theme]').innerHTML=ic(t==="dark"?"sun":"moon");S.theme=t;save()}
$('[data-act=menu]').innerHTML=ic("menu");$('[data-act=bell]').innerHTML=ic("bell")+'<span class="dot" aria-hidden="true"></span>';
setTheme(S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,d=el.dataset;
  switch(a){
  case"menu":document.body.classList.add("menu-open");break;
  case"menu-close":document.body.classList.remove("menu-open");break;
  case"theme":setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");break;
  case"bell":toast("Demo only: there are no real notifications.");break;
  case"close":dlg.close();break;
  case"vfilter":vf=d.v;rerender();break;
  case"vopen":videoDialog(+d.id);break;
  case"cfilter":cf=d.v;rerender();break;
  case"popen":postDialog(d.id);break;
  case"newpost":newPostDialog();break;
  case"vote":{const dir=+d.d;S.votes[d.id]=S.votes[d.id]===dir?0:dir;save();rerender();if(dlg.open)dlg.close();break}
  case"stab":stab=d.v;rerender();break;
  case"drip":dripSel=+d.i;rerender();setTimeout(()=>{const p=$('[data-testid=panel-sequence]');p&&p.scrollIntoView({block:"nearest"})},0);break;
  case"saveplay":{const i=+d.i;S.saved=S.saved.includes(i)?S.saved.filter(x=>x!==i):[...S.saved,i];save();rerender();break}
  case"copy":{const txt=SCRIPTS[+d.i].b;
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Script copied to clipboard."),()=>{
      const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();
      toast(ok?"Script copied to clipboard.":"Copy was blocked by the browser. Select the text and copy it manually.")});break}
  case"check":{S.checks[+d.i]=el.checked?1:0;save();rerender();break}
  case"book-progress":S.progress=Math.min(100,S.progress+5);save();rerender();break;
  case"goto-notes":e.preventDefault();$("#nt").scrollIntoView({behavior:"smooth",block:"center"});$("#nt").focus();break;
  case"calprev":{const t=today();if(cal.y===t.getFullYear()&&cal.m===t.getMonth())break;cal.m--;if(cal.m<0){cal.m=11;cal.y--}rerender();break}
  case"calnext":cal.m++;if(cal.m>11){cal.m=0;cal.y++}rerender();break;
  case"day":selDay=d.k;rerender();break;
  case"slot":bookDialog(d.t);break;
  case"join":openDlg(`<h2 id="dlg-title">Demo session</h2><p>This is a demo, so there is no real meeting link. In a production product, this button would open your video call with Lee.</p><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" data-act="close">Got it</button></div>`);break;
  case"cancelbook":S.bookings=S.bookings.filter(b=>b.id!==d.id);save();rerender();toast("Demo booking removed.");break;
  case"resdl":{const r=RESOURCES[+d.i],txt=`LO Academy sample resource\n\n${r[0]}\nCategory: ${r[1]}\n${r[2]}\n\nThis is a placeholder text file generated in your browser. It is not a real PDF, workbook, or lender document. Rates and numbers in LO Academy are illustrative only.\n`;
    const url=URL.createObjectURL(new Blob([txt],{type:"text/plain"})),l=document.createElement("a");l.href=url;l.download=slug(r[0])+"-sample.txt";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast("Sample text file downloaded.");break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.input==="notes"){S.notes=t.value;save()}
  if(t.dataset.input==="res"){rq=t.value;$("#res-list").innerHTML=resItems()}
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const kind=f.dataset.form,fd=new FormData(f),err=$(".err",f),fail=m=>{if(err)err.textContent=m};
  if(kind==="book-reply"){const t=(fd.get("text")||"").trim();if(!t)return fail("Please write a reply first.");S.bookReplies.push(["Alex Rivera",t]);save();rerender()}
  if(kind==="post-reply"){const t=(fd.get("text")||"").trim();if(!t)return fail("Please write a comment first.");const id=f.dataset.id;(S.postReplies[id]=S.postReplies[id]||[]).push(["Alex Rivera",t]);save();postDialog(id);rerender()}
  if(kind==="new-post"){const title=(fd.get("title")||"").trim(),body=(fd.get("body")||"").trim();if(!title)return fail("A title is required.");if(!body)return fail("Please add some body text.");
    S.posts.unshift({id:"u"+Date.now(),title,author:"Alex Rivera",cat:fd.get("cat"),votes:0,comments:0,time:"Just now",body,replies:[]});save();dlg.close();cf="All";rerender();toast("Post added to this browser.")}
  if(kind==="goals"){const g={loans:Number(fd.get("loans")),avg:Number(fd.get("avg")),rev:Number(fd.get("rev"))};
    if(![g.loans,g.avg,g.rev].every(v=>isFinite(v)&&v>0))return $("#goal-err").textContent="Enter a number greater than zero in every field.";
    S.goals=g;save();rerender();const b=$('[data-testid=button-save-goals]');if(b){b.classList.add("saved");b.innerHTML=ic("check")+(persisted?" Saved in this browser":" Saved for this session only")}}
  if(kind==="book"){const b={id:"b"+Date.now(),key:selDay,time:f.dataset.t,topic:fd.get("topic"),notes:(fd.get("notes")||"").trim()};
    if(taken(b.key,b.time))return fail("That slot was just taken.");S.bookings.push(b);save();
    $("#dlg-body").innerHTML=`<button class="x" data-act="close" aria-label="Close dialog">${ic("x")}</button><h2 id="dlg-title">Demo booking confirmed</h2><p><b>${dstr(new Date(b.key+"T00:00:00"))}</b> at <b>${b.time}</b> ET<br>${b.topic}</p><div style="margin:14px 0">${note("This is a simulation saved in your browser. No real appointment or meeting link was created and Lee has not been notified.")}</div><div style="text-align:right"><button class="btn primary" data-act="close" data-testid="button-done-booking">Done</button></div>`;rerender()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.body.classList.remove("menu-open")});
window.addEventListener("error",()=>{const v=$("#view");if(v&&!v.innerHTML.trim())v.innerHTML='<div class="page"><div class="card"><h2>Something went wrong</h2><button class="btn primary" onclick="location.reload()">Reload</button></div></div>'});
route();
</script>
</body>
</html>
